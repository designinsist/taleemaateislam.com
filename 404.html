<head>

  <meta property="og:site_name" content="Taleemaat-e-Islam" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="shortcut icon" href="/images/favicon.ico">

  <link rel="stylesheet" href="shared.css"/>
  <style>
    /* ═══ DESIGN SYSTEM VARIABLES ═══ */
    :root {
      --green-deep: #0d2818;
      --green-mid: #1a4a2e;
      --green-rich: #1e5c38;
      --green-bright: #2d7a50;
      --green-light: #e8f5ee;
      --gold: #c9963a;
      --gold-light: #e8b84b;
      --gold-pale: #f5e6c0;
      --gold-dim: #7a5a1a;
      --white: #ffffff;
      --off-white: #faf9f5;
      --text-dark: #1a2a1e;
      --text-mid: #3d5a45;
      --text-muted: #6b8a73;
      --border: rgba(201, 150, 58, 0.25);
      --shadow-green: rgba(13, 40, 24, 0.18);
      --nav-h: 72px;
      --radius: 4px;
      --transition: 0.3s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
      color: var(--text-dark);
      background: var(--off-white);
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px;
    }

    main {
      flex: 1;
    }

    /* ═══ MASTER NAVBAR ═══ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--green-mid);
      height: var(--nav-h);
      border-bottom: 1px solid rgba(201, 150, 58, 0.2);
      box-shadow: 0 2px 20px var(--shadow-green);
    }

    .navbar .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-logo-icon {
      width: 40px;
      height: 40px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      flex-shrink: 0;
    }

    .nav-logo-text strong {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.03em;
      line-height: 1.2;
    }

    .nav-logo-text span {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232, 184, 75, 0.6);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }

    .nav-item {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      height: 100%;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.82);
      transition: color var(--transition), background var(--transition);
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-item:hover>.nav-link {
      color: var(--gold-light);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-link svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
      transition: transform var(--transition);
    }

    .nav-item:hover>.nav-link svg {
      transform: rotate(180deg);
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 250px;
      background: var(--green-deep);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      box-shadow: 0 8px 30px var(--shadow-green);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: all 0.22s ease;
      z-index: 100;
    }

    .nav-item:hover .dropdown,
    .nav-item:focus-within .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown a {
      display: block;
      padding: 12px 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background var(--transition), color var(--transition), padding-left var(--transition);
    }

    .dropdown a:hover {
      background: rgba(201, 150, 58, 0.12);
      color: var(--gold-light);
      padding-left: 26px;
    }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .nav-hamburger span {
      display: block;
      height: 2px;
      background: var(--gold-light);
      border-radius: 2px;
      transition: all 0.3s ease;
      transform-origin: center;
    }

    .nav-hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .nav-hamburger.open span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .nav-hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .nav-drawer {
      display: none;
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--green-deep);
      z-index: 999;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .nav-drawer.open {
      transform: translateX(0);
    }

    .drawer-links {
      padding: 20px 0 40px;
    }

    .drawer-link {
      display: block;
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .drawer-link:hover {
      color: var(--gold-light);
      background: rgba(255, 255, 255, 0.04);
    }

    .drawer-section-title {
      padding: 18px 28px 6px;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-weight: 700;
    }

    .drawer-sub {
      padding-left: 44px;
      font-size: 0.88rem;
    }

    /* ═══ 404 ERROR SECTION ═══ */
    .error-section {
      padding: 50px 0;
      padding-top: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h) - 300px);
      /* Adjusts based on footer height */
    }

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      color: var(--gold);
      line-height: 1.2;
      margin-bottom: 10px;
      text-shadow: 0 10px 30px rgba(201, 150, 58, 0.15);
    }

    .error-arabic {
      font-family: 'Amiri', serif;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: var(--green-mid);
      margin-bottom: 24px;
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--green-deep);
      margin-bottom: 16px;
    }

    .error-title span {
      color: var(--gold);
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 550px;
      margin: 0 auto 36px;
      line-height: 1.8;
    }

    .btn-return {
      display: inline-block;
      padding: 14px 36px;
      background: var(--gold);
      color: var(--green-deep);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius);
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 15px rgba(201, 150, 58, 0.2);
    }

    .btn-return:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 150, 58, 0.3);
    }

    /* ═══ MASTER FOOTER ═══ */
    footer {
      background: #060f0a;
      color: rgba(255, 255, 255, 0.55);
    }

    .footer-main {
      padding: 64px 0 40px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 48px;
    }

    .footer-brand strong {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .footer-col h4 {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .footer-col a {
      display: block;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.5);
      padding: 5px 0;
      transition: color var(--transition);
    }

    .footer-col a:hover {
      color: var(--gold-light);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .footer-email-link {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: color var(--transition);
    }

    .footer-email-link:hover {
      color: var(--white);
    }

    /* RESPONSIVE */
    @media(max-width:1024px) {
      .footer-main {
        grid-template-columns: 1fr 1fr;
        gap: 36px
      }
    }

    @media(max-width:768px) {
      :root {
        --nav-h: 64px;
      }

      .nav-menu {
        display: none;
      }

      .nav-hamburger {
        display: flex;
      }

      .nav-drawer {
        display: block;
      }

      .footer-main {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .error-section {
        padding: 60px 0;
      }
    }
  </style>

    </section>
  </main>

  <div id="site-footer"></div>
  <script src="components.js"></script>
</body>
