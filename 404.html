    /* ═══ DESIGN SYSTEM VARIABLES ═══ */
    :root {

    *,

      box-sizing: border-box;
      margin: 0;
      padding: 0;

    html {

    body {

      font-weight: 400;
      color: var(--text-dark);
      background: var(--off-white);
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;

    img {

    }

    a {

    }

    ul {

    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px;

    main {
      flex: 1;
    }

    .error-section {
      padding: 50px 0;
      padding-top: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h) - 300px);
      /* Adjusts based on footer height */

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      color: var(--gold);
      line-height: 1.2;

      text-shadow: 0 10px 30px rgba(201, 150, 58, 0.15);

    .error-arabic {

      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: var(--green-mid);
      margin-bottom: 24px;

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--green-deep);
      margin-bottom: 16px;

    .error-title span {
      color: var(--gold);

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);

      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius);

    }

    .btn-return:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 150, 58, 0.3);
